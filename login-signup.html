        </div>
    </div>


    <script type="text/javascript">
        if (window.localStorage.getItem("theme") === "dark-theme"){
            document.documentElement.classList.add("dark-theme")}

        const signupTitle =document.querySelector('.signup-box__title')
        const login =document.querySelector('.login-box__title')
        const signupBox =document.querySelector('.signup-box')

        signupTitle.addEventListener('click',function (){
            signupBox.classList.toggle('signup-box--show')
        })
        login.addEventListener('click',function (){
            signupBox.classList.remove('signup-box--show')
        })
    </script>
</body>
</html>
