    const exitPanel =document.querySelector('.navigation__exit');
    const glass = document.querySelector('.glass');
    const  navBtn = document.querySelector('.panel__nav-btn');
    const panelNav =document.querySelector('.panel__nav');
    const panelItems = document.querySelectorAll('.panel__item-menu');

    changeThemeBtn.forEach(changeTheme => {
        if (window.localStorage.getItem("theme") === "dark-theme"){
            document.documentElement.classList.add("dark-theme")
            changeTheme.innerHTML = lightIcon;
        } else {
            changeTheme.innerHTML = darkIcon;
        }
    })

    changeThemeBtn.forEach(changeTheme => {
        changeTheme.addEventListener('click',function (){
            document.documentElement.classList.toggle("dark-theme")
            if (document.documentElement.classList.contains("dark-theme")){
                window.localStorage.setItem("theme", "dark-theme")
                this.innerHTML = lightIcon;
            } else {
                window.localStorage.setItem("theme", "light-theme")
                this.innerHTML = darkIcon;
            }
        })
    })


    navBtn.addEventListener('click',function (){
        panelNav.classList.toggle('panel__nav--open')
        glass.classList.toggle('show-glass')
    })
    glass.addEventListener('click',function (){
        glass.classList.remove('show-glass')
        panelNav.classList.remove('panel__nav--open')
    })
    exitPanel.addEventListener('click',function (){
        panelNav.classList.toggle('panel__nav--open')
        glass.classList.toggle('show-glass')
    })


    panelItems.forEach(panelItem => {
        panelItem.addEventListener('click',function (){
            document.querySelector('.panel__item-menu--active').classList.remove('panel__item-menu--active')
            document.querySelector('.item-menu__content--show').classList.remove('item-menu__content--show')
            this.classList.add('panel__item-menu--active')
            let contentId = this.getAttribute('data-content-id')
            document.querySelector(contentId).classList.add('item-menu__content--show')
        })
    })

</script>
